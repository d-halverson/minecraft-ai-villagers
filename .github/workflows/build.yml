name: build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v4
      - name: Make gradlew executable
        run: chmod +x gradlew
      - name: Run unit tests
        run: ./gradlew test --no-daemon
      - name: Build mod jar
        run: ./gradlew build --no-daemon
      - name: Upload mod jar artifact
        uses: actions/upload-artifact@v4
        with:
          name: mod-jar
          path: build/libs/aivillagers-*.jar
          if-no-files-found: error

  release:
    name: GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [build]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: mod-jar
          path: release
      - name: Check the tag matches the mod version
        id: meta
        run: |
          version="$(sed -n 's/^version=//p' gradle.properties)"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match mod version $version (gradle.properties)" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          case "$version" in
            *-*|0.*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;;
            *)       echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac
      - name: Compute SHA-256 checksums
        working-directory: release
        run: |
          ls -la
          sha256sum aivillagers-* | tee SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: AI Villagers ${{ steps.meta.outputs.version }}
          prerelease: ${{ steps.meta.outputs.prerelease == 'true' }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release/aivillagers-*.jar
            release/SHA256SUMS.txt
